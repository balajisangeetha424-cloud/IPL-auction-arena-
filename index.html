const normPlayer=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"").replace(/^(b|mr|ms)/,"");

function playerStats(name){
 const all={...BUILTIN_2025_STATS,...((S&&S.stats2025)||{}),...imported2025Stats};
 const key=normPlayer(name);
 for(const [n,v] of Object.entries(all)) if(normPlayer(n)===key) return v;
 // Common display-name variants from IPL datasets
 const aliases={"bsaisudharsan":"saisudharsan","suriyakumaryadav":"suryakumaryadav"};
 const alt=aliases[key];
 if(alt) for(const [n,v] of Object.entries(all)) if(normPlayer(n)===alt) return v;
 return null;
}
function csvCells(line){
 const out=[];let cur="",q=false;
 for(let i=0;i<line.length;i++){const c=line[i];if(c=='"'&&line[i+1]=='"'){cur+='"';i++}
 else if(c=='"')q=!q;else if(c==","&&!q){out.push(cur);cur=""}else cur+=c}
 out.push(cur);return out;
}
function importStatsFile(input){
 const file=input.files&&input.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const lines=String(reader.result).replace(/^\uFEFF/,"").trim().split(/\r?\n/);
   const heads=csvCells(lines.shift()).map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]/g,""));
   const ix=(...names)=>heads.findIndex(h=>names.includes(h));
   const ni=ix("playername","player","name");
   const ri=ix("runsscored","runs","totalruns");
   const wi=ix("wicketstaken","wickets","totalwickets");
   const mi=ix("matchesbatted","matches","mat");
   const ai=ix("battingaverage","average","avg");
   const si=ix("battingstrikerate","strikerate","sr");
   const ei=ix("economyrate","economy","econ");
   if(ni<0||ri<0||wi<0)throw new Error("CSV must include Player_Name, Runs_Scored and Wickets_Taken columns.");
   const data={};
   for(const line of lines){if(!line.trim())continue;const c=csvCells(line),name=(c[ni]||"").trim();if(!name)continue;
    const num=i=>i<0||c[i]===""||c[i]===undefined?null:Number(c[i]);
    data[name]={runs:num(ri),wickets:num(wi),matches:num(mi),avg:num(ai),sr:num(si),econ:num(ei)};
   }
   imported2025Stats={...imported2025Stats,...data};S.stats2025={...(S.stats2025||{}),...data};localStorage.setItem("ipl2025Stats",JSON.stringify(imported2025Stats));pub();
   alert("Imported "+Object.keys(data).length+" player records. The host data is saved to the auction state.");report();
  }catch(e){alert("Could not import CSV: "+e.message)}
 };
 reader.readAsText(file);
}
function statText(v){return v===null||v===undefined||v===""?"—":v}
function teamAnalysis(k){
 // The squad array is the source of truth: only players actually sold to this team count.
 const squad=(S.sq&&S.sq[k])||[];
 const records=squad.map(x=>({...pl(x.id),paid:Number(x.paid)||0,stats:playerStats(pl(x.id).name)}));
 const known=records.filter(x=>x.stats&&(x.stats.runs!=null||x.stats.wickets!=null));
 const runs=records.reduce((a,x)=>a+(x.stats&&x.stats.runs!=null?Number(x.stats.runs):0),0);
 const wickets=records.reduce((a,x)=>a+(x.stats&&x.stats.wickets!=null?Number(x.stats.wickets):0),0);
 const avgSR=records.filter(x=>x.stats&&x.stats.sr!=null).map(x=>Number(x.stats.sr));
 const sr=avgSR.length?(avgSR.reduce((a,b)=>a+b,0)/avgSR.length).toFixed(1):"—";

 const clamp100=n=>Math.max(0,Math.min(100,n));
 const batScore=s=>{
  if(!s||s.runs==null)return null;
  const parts=[{v:clamp100(Number(s.runs)/759*100),w:.4}];
  if(s.avg!=null)parts.push({v:clamp100(Number(s.avg)/60*100),w:.3});
  if(s.sr!=null)parts.push({v:clamp100(Number(s.sr)/200*100),w:.3});
  const w=parts.reduce((a,x)=>a+x.w,0);
  return parts.reduce((a,x)=>a+x.v*x.w,0)/w;
 };
 const bowlScore=s=>{
  if(!s||s.wickets==null)return null;
  const parts=[{v:clamp100(Number(s.wickets)/25*100),w:.7}];
  if(s.econ!=null)parts.push({v:clamp100((12-Number(s.econ))/7*100),w:.3});
  const w=parts.reduce((a,x)=>a+x.w,0);
  return parts.reduce((a,x)=>a+x.v*x.w,0)/w;
 };
 const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
 const batters=records.filter(x=>["Batter","WK","AR"].includes(x.role)).map(x=>batScore(x.stats)).filter(x=>x!==null);
 const bowlers=records.filter(x=>["Fast","Spin","AR"].includes(x.role)).map(x=>bowlScore(x.stats)).filter(x=>x!==null);
 const allrounders=records.filter(x=>x.role==="AR").map(x=>{
  const b=batScore(x.stats),w=bowlScore(x.stats);
  return b===null?w:w===null?b:(b+w)/2;
 }).filter(x=>x!==null);
 const batting=mean(batters),bowling=mean(bowlers),allrounder=mean(allrounders);

 // Squad balance is assessed from the actual roles bought, not from player prices.
 const counts={
  Batter:records.filter(x=>x.role==="Batter").length,
  WK:records.filter(x=>x.role==="WK").length,
  Fast:records.filter(x=>x.role==="Fast").length,
  Spin:records.filter(x=>x.role==="Spin").length,
  AR:records.filter(x=>x.role==="AR").length
 };
 const targets={Batter:4,WK:1,Fast:4,Spin:2,AR:2};
 const targetTotal=Object.values(targets).reduce((a,b)=>a+b,0);
 const balance=records.length?100*Object.keys(targets).reduce((a,r)=>a+Math.min(counts[r],targets[r]),0)/targetTotal:0;

 // Missing statistical categories are excluded and the remaining weights are rescaled.
 const categories=[{v:batting,w:.30},{v:bowling,w:.30},{v:allrounder,w:.15},{v:balance,w:.25}]
  .filter(x=>x.v!==null);
 const weight=categories.reduce((a,x)=>a+x.w,0);
 const score=(records.length&&known.length&&weight)?
  Math.round(categories.reduce((a,x)=>a+x.v*x.w,0)/weight*10)/10:null;
 const coverage=records.length?Math.round(known.length/records.length*100):0;
 return {k,bought:records,records,known,runs,wickets,sr,batting,bowling,allrounder,balance,score,coverage,counts};
}
function ana(k){return teamAnalysis(k)}
function scoreText(v){return v===null?"N/A":v.toFixed(1)}
function report(){
 setStep(4);
 // Include all ten teams, including teams with no purchases or no available player records.
 const teams=K.map(ana).sort((a,b)=>{
  if(a.score===null&&b.score!==null)return 1;

  if(a.coverage!==b.coverage)return b.coverage-a.coverage;

 });

 const teamCards=teams.filter(a=>a.bought.length).map((a,i)=>`<div class=team-analysis>

 <div class=bd style="margin-top:8px"><div><b>${a.runs}</b><br>Known 2025 runs</div><div><b>${a.wickets}</b><br>Known 2025 wickets</div><div><b>${a.sr}</b><br>Average strike rate</div><div><b>${a.coverage}%</b><br>Stats coverage</div></div>
 <div class=statline><span>Batting score</span><b>${scoreText(a.batting)}</b></div>

 <div class=sc><table><tr><th>Player</th><th>Role</th><th>Paid</th><th>Runs</th><th>Wkts</th><th>Avg</th><th>SR</th><th>Econ</th></tr>
 ${a.records.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.role}</td><td>${f(p.paid)}</td><td>${statText(p.stats&&p.stats.runs)}</td><td>${statText(p.stats&&p.stats.wickets)}</td><td>${statText(p.stats&&p.stats.avg)}</td><td>${statText(p.stats&&p.stats.sr)}</td><td>${statText(p.stats&&p.stats.econ)}</td></tr>`).join("")}</table></div>
 <div class=stat-muted>${a.known.length}/${a.bought.length} purchased players have at least one built-in/imported 2025 performance record.</div>
 </div>`).join("");
 const best=teams.find(x=>x.score!==null);

 $("app").innerHTML=`<div class=card style="text-align:center;border:2px solid var(--gold)">
 <div style="font-size:40px">🏆</div><div class=tag>AUCTION RESULTS · ${S.stoppedByHost?"STOPPED BY HOST":"AUCTION COMPLETED"}</div>

 </div>
 <div class=card><b style="font-size:18px">🏆 Overall team ranking · 1st to 10th</b>
 <p class=stat-muted>All ten teams are compared and automatically sorted by overall score. Only players actually purchased before the host stopped/completed the auction are counted.</p>
 <div class=leaderboard-wrap><table class=leaderboard><tr><th>Rank</th><th>Team</th><th>Players</th><th>Batting</th><th>Bowling</th><th>All-rounder</th><th>Balance</th><th>Overall</th></tr>${rankedRows}</table></div>
 <div class=stat-muted style="margin-top:8px">Overall score uses available 2025 performance categories plus squad-role balance. If player records are missing, the team is marked with its statistics coverage; missing values are not treated as zero. Teams without any performance records show N/A and are placed below teams with a calculable score.</div>
 </div>
 <div class=card><b style="font-size:18px">📊 Purchased-player performance details</b>
 <div class=row style="margin:10px 0"><button onclick="$('statsFile').click()">⬆ Import full IPL 2025 stats CSV</button><input id=statsFile type=file accept=".csv,text/csv" style="display:none" onchange="importStatsFile(this)"></div>
 <div class=stat-muted>CSV columns: Player_Name, Runs_Scored, Wickets_Taken. Optional: Matches, Batting_Average, Batting_Strike_Rate, Economy_Rate. Import the full season dataset for a fairer ranking across every purchased player.</div>
 ${teamCards||"<p>No players were purchased.</p>"}
 <p class=stat-muted>* Totals include only available built-in/imported records. Missing player records are not treated as zero.</p></div>

 <div class=statline><span>Unsold players</span><b>${(S.unsold||[]).length}</b></div><div class=statline><span>Missing 2025 player records</span><b>${missing}</b></div></div>
 ${m?`<div class=card><b>My team: ${m}</b><div class=tag>${(S.sq[m]||[]).length} purchased player(s)</div></div>`:""}
